description: 'A “whitebox” AES build got leaked… except it’s just a dump of lookup tables.

  Most of them are decoys, some are crafted to waste your time.


  Recover the AES-128 master key from the table dump and the known plaintext/ciphertext pairs,

  then decrypt the flag.


