services:
  uaul:
    build: .
    ports:
      - "61000:3000"
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=super_secret_admin_password_2025!
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"
